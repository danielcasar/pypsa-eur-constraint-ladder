# =============================================================================
# PyPSA-Eur override for the continental 2024 dispatch-only constraint-ladder
# paper. Only keys that differ from `pypsa-eur/config/config.default.yaml` are
# listed; everything else inherits the default.
#
# Calibration year is 2024, not 2025: PyPSA-Eur v2026.02.0 bundled several
# year-keyed data files (synthetic load, nuclear p_max_pu, ...) that stop at
# 2024. Hand-patching every gap to reach 2025 was incrementally fragile; 2024
# keeps every input on its natively-supported axis. The market regime
# (post-gas-crisis "new normal") is the same either way.
#
# Server-side usage (from `pypsa-eur/`):
#
#   snakemake -j 20 \
#       --configfile ../ladder/configs/eu_2024_dispatch.yaml \
#       -- resources/eu_2024_dispatch/networks/base_s_50_elec_.nc
#
# This prepares the network file our manual workflow consumes. After the
# preparation, hand the .nc off to `code/driver/example.py` (or your own
# interactive session) to apply the constraint ladder step by step.
# =============================================================================

# ----- run identifier --------------------------------------------------------
# A distinct run name keeps the prepared network + resources isolated from any
# default/test runs that may also exist under the same PyPSA-Eur clone.
run:
  name: "eu_2024_dispatch"
  shared_resources:
    policy: false


# ----- planning horizon ------------------------------------------------------
# Single-period overnight optimisation. `planning_horizons: [2024]` does not
# trigger capacity expansion because `electricity.extendable_carriers` (below)
# is empty; it only sets the year label PyPSA-Eur uses for cost / fuel-price
# lookups.
foresight: overnight
scenario:
  clusters:
    # 'adm' = administrative clustering driven by the bidding-zone shape
    # file (see clustering.mode below). One cluster per real bidding zone
    # (IT-NORD/CSUD/SUD/SARD/SICI/CNORD, SE1-4, NO1-4 with NO5 merged into
    # NO2 per build_bidding_zones.py, DK1/DK2, etc.). Replaces the prior
    # numeric kmeans cluster count.
    - adm
  opts:
    - ''
  sector_opts:
    - ''
  planning_horizons:
    # PyPSA-Eur publishes cost files only at quinquennial horizons
    # (2020, 2025, 2030, ..., 2050). 2025 is the nearest published horizon
    # and is the cost-data file the retrieve_cost_data rule fetches via the
    # wildcard. We use it as a forward-looking proxy for 2024 fuel + CO2
    # prices (actual 2024 levels are close to the 2025 assumption).
    - 2025


# ----- bidding-zone-aware clustering -----------------------------------------
# Use PyPSA-Eur's built-in bidding-zone shapes (build_bidding_zones.py output
# at resources/bidding_zones.geojson) as the cluster source. Each cluster is
# one real bidding zone, so per-zone shadow prices align with the per-zone
# ENTSO-E day-ahead reference used for validation.
clustering:
  mode: administrative
  administrative:
    level: bz


# ----- calendar (full year 2024, hourly) -------------------------------------
# 2024 is a leap year -- 8784 hourly snapshots.
snapshots:
  start: "2024-01-01"
  end: "2025-01-01"
  inclusive: "left"


# ----- dispatch-only: no extendable capacities -------------------------------
# Both `electricity` and `sector` carrier lists empty so neither the power-
# system extension variables nor the cross-sector extension variables enter
# the LP. The model only chooses dispatch / flows / storage operation on the
# 2024-pinned fleet.
electricity:
  extendable_carriers:
    Generator: []
    StorageUnit: []
    Store: []
    Link: []

sector:
  extendable_carriers:
    Generator: []
    StorageUnit: []
    Store: []
    Link: []


# ----- weather year (cutout) -------------------------------------------------
# Replace the bundled default `europe-2013-sarah3-era5` cutout with the
# `europe-2024-sarah3-era5` cutout (pre-published at data.pypsa.org). All
# renewable + hydro profiles are then computed on 2024 meteorology, aligned
# with the snapshot calendar and the 2024-pinned fleet / load.
atlite:
  default_cutout: "europe-2024-sarah3-era5"


# ----- cost data year + 2024-actual overrides --------------------------------
# PyPSA-Eur publishes cost CSVs only at quinquennial horizons; 2025 is the
# nearest published file. We start from that and override the
# year-volatile entries (fuel + CO2 prices) with observed 2024 averages so
# marginal costs are calibrated to the actual 2024 dispatch regime.
#
# Sources of the override values are documented in PYPSA_EUR_OVERRIDES.md.
#
#   * gas      32  -- TTF day-ahead 2024 average, EUR/MWh thermal
#   * coal     11  -- CIF NW-Europe API2 2024 average, EUR/MWh thermal
#   * lignite   4  -- mine-mouth, stable
#   * oil      50  -- Brent equivalent 2024 average
#   * uranium 1.7  -- nuclear fuel cycle, stable
#   * biomass  25  -- NorthWest Europe wholesale 2024
#   * co2      65  -- EUA front-year contract 2024 average, EUR/tCO2
#
# OCGT and CCGT fuel cost inherits from `gas` (process_cost_data.py L178-179).
costs:
  year: 2025
  overwrites:
    fuel:
      gas: 32
      coal: 11
      lignite: 4
      oil: 50
      uranium: 1.7
      biomass: 25
  emission_prices:
    enable: true
    co2: 65


# ----- solver ----------------------------------------------------------------
# Barrier without crossover is the right default for big continental LPs.
# Leave ~4 cores for I/O and linopy bookkeeping; Marvin has 24 physical cores
# so threads=20 is the safe ceiling.
solving:
  solver:
    name: gurobi
    options: gurobi-default

  solver_options:
    gurobi-default:
      threads: 20
      method: 2              # barrier
      crossover: 0           # skip crossover; barrier point is enough for duals
      BarConvTol: 1.e-6
      FeasibilityTol: 1.e-5
      OptimalityTol: 1.e-5
      Seed: 123
