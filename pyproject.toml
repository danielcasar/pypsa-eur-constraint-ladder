[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypsa-eur-constraint-ladder"
version = "0.1.0"
description = "Constraint-ladder attribution of the model-market shadow-price gap on PyPSA-Eur."
readme = "SETUP_NOTES.md"
requires-python = ">=3.10"
authors = [
    { name = "Daniel Cäsar", email = "caesar@eeg.tuwien.ac.at" },
]
license = { text = "MIT" }
dependencies = [
    "pypsa>=1.0",
    "linopy>=0.4",
    "numpy",
    "pandas",
    "xarray",
]

[tool.setuptools.packages.find]
where = ["code"]
include = ["constraints*", "driver*", "analysis*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
